services:
  # 1. Python OR-Tools Scheduler Microservice
  - type: web
    name: campusflow-scheduler
    runtime: python
    rootDir: scheduler
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Node.js Express Backend API
  - type: web
    name: campusflow-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: campusflow-db
          property: connectionString
      - key: SCHEDULER_URL
        fromService:
          type: web
          name: campusflow-scheduler
          property: host
      - key: JWT_SECRET
        generateValue: true

  # 3. React / Vite Frontend (Static Web App)
  - type: web
    name: campusflow-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database
  - name: campusflow-db
    databaseName: campus_scheduler
    user: postgres
    plan: free
